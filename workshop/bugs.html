<!DOCTYPE html>
<!--
  workshop/bugs.html — THE BUG TRACKER BENCH.

  Reads docs/bugs.json through the workshop server's /__bugs endpoint and renders
  it for a human. Answers the ship gate at the top, then Active / Deferred /
  Closed — all three DERIVED from the status field, never stored.

  ⛔⛔ EVERY PIECE OF ENTRY TEXT REACHES THE DOM THROUGH textContent. NEVER
  innerHTML, and never a string template that interpolates entry text.

  This is a wall, not a habit, and it was bought at full price. FirstLight TL-021:
  a single " inside an entry body broke the HTML parser out of a data- attribute,
  every following word became an attribute NAME, and one of those words was the
  literal `hidden` — because the entry was about a cursor that would not hide.
  [hidden]{display:none} is in the browser's own stylesheet. The card was in the
  DOM and invisible. The tally said 8; the page drew 7. It cost a night.

  ⭐ The fix is not a better escaper. Escaping is a rule you must keep right every
  time; building nodes is a shape where the failure cannot be expressed.

  ⛔ READ-ONLY. There is no filing form, by ruling — bugs go through Bob, because
  triage is a judgment and a judgment does not go in a form.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenEar — bugs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%234A90D9' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%234A90D9'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0b1220; --card:#121c2e; --line:#1e2a42; --ink:#dbe4f5; --dim:#8095b8;
          --blue:#4A90D9; --red:#e05561; --amber:#F5A623; --green:#48BB78; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 -apple-system,BlinkMacSystemFont,Segoe UI,Verdana,sans-serif; }
  header { padding:18px 22px 12px; border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); z-index:5 }
  h1 { margin:0 0 10px; font-size:17px; letter-spacing:.5px }
  h1 a { color:var(--dim); text-decoration:none; font-size:12px; letter-spacing:2px; margin-right:12px }
  #gate { padding:10px 14px; border-radius:8px; font-weight:700; margin:10px 0 4px }
  .gate-ok  { background:#12301f; color:var(--green); border:1px solid #1d4a30 }
  .gate-bad { background:#33161a; color:var(--red);  border:1px solid #5a2029 }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px }
  input,select { background:var(--card); color:var(--ink); border:1px solid var(--line);
                 border-radius:6px; padding:7px 10px; font:inherit }
  input { flex:1; min-width:220px }
  main { padding:14px 22px 60px; max-width:1100px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:2px; color:var(--dim);
       margin:26px 0 10px; border-bottom:1px solid var(--line); padding-bottom:6px }
  .card { background:var(--card); border:1px solid var(--line); border-left-width:4px;
          border-radius:8px; padding:11px 14px; margin-bottom:9px }
  .row1 { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap }
  .id { font-family:ui-monospace,Menlo,monospace; color:var(--blue); font-weight:700 }
  .title { font-weight:600; flex:1; min-width:200px }
  .tag { font-size:11px; letter-spacing:1px; padding:2px 7px; border-radius:4px;
         border:1px solid var(--line); color:var(--dim); white-space:nowrap }
  .blocking { color:var(--red); border-color:#5a2029; font-weight:700 }
  .notes { white-space:pre-wrap; color:var(--dim); margin-top:8px; font-size:13px;
           border-top:1px dashed var(--line); padding-top:8px }
  .verify { font-size:11px; color:var(--dim); margin-top:6px; letter-spacing:.5px }
  .empty { color:var(--dim); font-style:italic; padding:6px 0 }
  footer { color:var(--dim); font-size:12px; padding:0 22px 40px }
</style>
</head>
<body>
<header>
  <h1><a href="index.html">&#8962; WORKSHOP</a> OpenEar &mdash; bugs</h1>
  <div id="gate">loading&hellip;</div>
  <div class="controls">
    <input id="q" placeholder="search id, title, notes&hellip;" autocomplete="off" />
    <select id="where"><option value="">everywhere</option></select>
    <select id="kind"><option value="">all series</option></select>
  </div>
</header>
<main id="out"></main>
<footer id="legend"></footer>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let DATA = null, stamp = null;

// ⭐ Every helper below builds NODES. There is no innerHTML in this file, and
//    nothing that concatenates entry text into markup. See the header comment.
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
};

const ACTIVE   = ['OPEN', 'IN PROGRESS', 'FIXED'];
const DEFERRED = ['DEFERRED'];

// ⛔ SORT BY DATE, NEVER BY ID. Two series drift apart, and a brand-new entry in
//    the low-numbered series would bury itself under a week-old one. Id descending
//    is only the tiebreak inside a single day.
const byDate = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.num || 0) - (a.num || 0);

function card(e) {
  const c = el('div', 'card');
  c.style.borderLeftColor =
    e.blocking ? 'var(--red)'
    : e.status === 'OPEN' || e.status === 'IN PROGRESS' ? 'var(--blue)'
    : 'var(--line)';

  const r = el('div', 'row1');
  r.append(el('span', 'id', e.id), el('span', 'title', e.title));
  if (e.blocking) r.append(el('span', 'tag blocking', 'BLOCKING'));
  r.append(el('span', 'tag', e.status));
  // ⛔ Entries of kind TOOL carry no `where` — the kind already says it. Guard,
  //    or the row grows an empty chip that looks like a missing value.
  if (e.where) r.append(el('span', 'tag', e.where));
  r.append(el('span', 'tag', e.date));
  if (e.dupeOf) r.append(el('span', 'tag', 'dupe of ' + e.dupeOf));
  // `was` is a string for one rename, a list when an entry has moved twice.
  if (e.was) r.append(el('span', 'tag', 'was ' + [].concat(e.was).join(', ')));
  c.append(r);

  if (e.notes) c.append(el('div', 'notes', e.notes));
  if (e.verify) {
    c.append(el('div', 'verify', 'verify — dev: ' + (e.verify.dev || '?') +
                                 '   ·   live: ' + (e.verify.live || '?')));
  }
  return c;
}

function section(title, list) {
  const out = document.getElementById('out');
  out.append(el('h2', null, title + '  (' + list.length + ')'));
  if (!list.length) { out.append(el('div', 'empty', 'nothing here')); return; }
  list.sort(byDate).forEach(e => out.append(card(e)));
}

function render() {
  const out = document.getElementById('out');
  out.textContent = '';                              // ⭐ clears without parsing
  if (!DATA) return;

  const q = document.getElementById('q').value.toLowerCase().trim();
  const w = document.getElementById('where').value;
  const k = document.getElementById('kind').value;

  // ⭐ `was` is searched on purpose: an old id cited in a commit message, a
  //    changelog or a code comment must still find its entry after a rename.
  const match = e =>
    (!w || e.where === w) && (!k || e.kind === k) &&
    (!q || [e.id, e.title, e.notes, e.status, e.where, [].concat(e.was || []).join(' ')]
             .join(' ').toLowerCase().includes(q));

  const all = (DATA.entries || []).filter(match);

  // ⭐ THE SHIP GATE — `blocking`, over ACTIVE entries only, and it is the top
  //    line of the page because it is the question the tracker exists to answer.
  //    ⛔ It reads the WHOLE tracker, never the filtered list: a gate that
  //    answers differently depending on a dropdown is not a gate.
  //    ⛔ kind TOOL is excluded — a broken bench cannot make the server unfit to
  //    serve a service, and a banner that reads BLOCKED over a bench is a banner
  //    he learns to ignore.
  const blockers = (DATA.entries || []).filter(
    e => ACTIVE.includes(e.status) && e.blocking === true && e.kind !== 'TOOL');
  const gate = document.getElementById('gate');
  gate.className = blockers.length ? 'gate-bad' : 'gate-ok';
  gate.textContent = blockers.length
    ? '⛔  ' + blockers.length + ' blocking — ' +
      blockers.map(b => b.id).join(', ') + '. Not shippable to a congregation.'
    : '✅  Nothing blocking. Ship gate is clear.';

  section('Active',   all.filter(e => ACTIVE.includes(e.status)));
  section('Deferred', all.filter(e => DEFERRED.includes(e.status)));
  section('Closed',   all.filter(e => !ACTIVE.includes(e.status) && !DEFERRED.includes(e.status)));
}

// ⭐ Idempotent on purpose: it is only called once today, so a second call would
//    silently DOUBLE both dropdowns rather than fail. Correct in itself beats
//    correct because of who calls it.
function fillSelects() {
  const w = document.getElementById('where'), k = document.getElementById('kind');
  [w, k].forEach(s => { while (s.options.length > 1) s.remove(1); });  // keep the "all" row
  (DATA.where || []).forEach(v => w.append(el('option', null, v)));
  [...new Set((DATA.entries || []).map(e => e.kind))].sort()
    .forEach(v => k.append(el('option', null, v)));
  const f = document.getElementById('legend');
  f.textContent = '';
  f.append(el('div', null, DATA.ids || ''), el('div', null, DATA.note || ''));
}

async function load(first) {
  const r = await fetch('/__bugs', { cache: 'no-store' });
  DATA = await r.json();
  if (first) fillSelects();
  render();
}

// ⭐ Poll the cheap stamp, pull the whole tracker only when it moves. The tracker
//    is small today, but this is the shape that stays correct when it is not.
async function poll() {
  try {
    const s = await (await fetch('/__bugs-stamp', { cache: 'no-store' })).json();
    const key = s.m + ':' + s.s;
    if (stamp !== null && key !== stamp) await load(false);
    stamp = key;
  } catch { /* server stopped; keep showing what we have */ }
}

['q', 'where', 'kind'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

load(true).catch(e => {
  document.getElementById('gate').className = 'gate-bad';
  document.getElementById('gate').textContent = 'could not read the tracker: ' + e.message;
});
setInterval(poll, 3000);
</script>
</body>
</html>
